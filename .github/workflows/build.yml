name: build
on:
  push:
    branches: [main]
    paths-ignore: ['README.md']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: build
  cancel-in-progress: true
jobs:
  start:
    runs-on: ubuntu-latest
    steps:
      - name: Mark start
        run: |
          cd /tmp && rm -rf res && mkdir res && cd res && git init -q && git checkout -q -b ci-results
          git config user.name gruz-ci; git config user.email ci@gruz.invalid
          git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}"
          (git fetch -q origin ci-results && git reset -q --hard origin/ci-results) || true
          mkdir -p build && echo "started ${{ github.sha }} run ${{ github.run_number }} $(date -u)" > build/STARTED
          git add -A && git commit -qm "start ${{ github.run_number }}" && git push -q origin ci-results || true
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        mc: ['1.8.9', '1.20.1', '1.20.4', '1.21.1', '1.21.4', '1.21.11', '26.1', '26.2', '26.3']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '25' }
      - name: Build ${{ matrix.mc }}
        env:
          GRUZ_MC: ${{ matrix.mc }}
        run: |
          mkdir -p out/${{ matrix.mc }}
          chmod +x gradlew
          set +e
          if [ -d legacy/${{ matrix.mc }} ]; then
            # 1.8.9: osobny projekt Legacy Fabric (yarn, Java 8) – nie ma go w versions/
            (cd legacy/${{ matrix.mc }} && chmod +x gradlew && timeout 25m ./gradlew --no-daemon --stacktrace --console=plain build) > out/${{ matrix.mc }}/full.log 2>&1
            echo $? > out/${{ matrix.mc }}/exit
            python3 ci/errors.py out/${{ matrix.mc }}/full.log > out/${{ matrix.mc }}/errors.txt
            f=$(ls legacy/${{ matrix.mc }}/build/libs/gruzclient-*.jar 2>/dev/null | grep -v sources | head -1)
            [ -n "$f" ] && cp "$f" out/${{ matrix.mc }}/gruzclient-${{ matrix.mc }}.jar && touch out/${{ matrix.mc }}/ok
          else
          timeout 25m ./gradlew --no-daemon --stacktrace --console=plain :${{ matrix.mc }}:collect > out/${{ matrix.mc }}/full.log 2>&1
          echo $? > out/${{ matrix.mc }}/exit
          python3 ci/errors.py out/${{ matrix.mc }}/full.log > out/${{ matrix.mc }}/errors.txt
          cp build/out/*.jar out/${{ matrix.mc }}/ 2>/dev/null && touch out/${{ matrix.mc }}/ok
          fi
          exit 0
      - name: Smoke test ${{ matrix.mc }} (start the game)
        if: hashFiles(format('out/{0}/ok', matrix.mc)) != ''
        env:
          GRUZ_MC: ${{ matrix.mc }}
          GRUZ_SMOKE: '1'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb libgl1-mesa-dri mesa-utils x11-xserver-utils > /dev/null
          # 1.8.9 (LWJGL 2) czyta tryby ekranu programem xrandr (x11-xserver-utils)
          set +e
          # 26.3+ (SDL3): bez GPU xvfb nie ma pasującego GLX visual – próbujemy EGL i programowego renderowania Mesy
          export SDL_VIDEO_FORCE_EGL=1 LIBGL_ALWAYS_SOFTWARE=1
          if [ -d legacy/${{ matrix.mc }} ]; then
            (cd legacy/${{ matrix.mc }} && xvfb-run -a -s "-screen 0 1280x720x24 +extension GLX +render" timeout 15m ./gradlew --no-daemon --console=plain runClient) > out/${{ matrix.mc }}/smoke.log 2>&1
          else
          xvfb-run -a -s "-screen 0 1280x720x24 +extension GLX +render" timeout 15m ./gradlew --no-daemon --console=plain :${{ matrix.mc }}:runClient > out/${{ matrix.mc }}/smoke.log 2>&1
          fi
          L=out/${{ matrix.mc }}/smoke.log
          if grep -q GRUZ_SMOKE_OK $L; then echo OK > out/${{ matrix.mc }}/smoke
          # gra nie dostała okna OpenGL/Vulkan na serwerze CI (nie wina moda) i nie ma błędów miksów -> publikujemy jako NOGPU
          elif grep -q -E "BackendCreationException|No display mode extension is available" $L && ! grep -q -i -E "InvalidInjectionException|MixinApplyError|MixinTransformerError|Mixin apply.*failed|InvalidMixinException" $L; then echo NOGPU > out/${{ matrix.mc }}/smoke
          else echo FAIL > out/${{ matrix.mc }}/smoke; fi
          grep -n -i -E "mixin|error|exception|GRUZ_SMOKE|Caused by" out/${{ matrix.mc }}/smoke.log | grep -v -i "warn.*sound" | head -300 > out/${{ matrix.mc }}/smoke-errors.txt
          cp versions/${{ matrix.mc }}/run/crash-reports/*.txt out/${{ matrix.mc }}/ 2>/dev/null
          exit 0
      - name: Inspect classes (ci/inspect.txt)
        if: hashFiles('ci/inspect.txt') != ''
        run: python3 ci/inspect.py ${{ matrix.mc }} out/${{ matrix.mc }} || true
      - name: Publish this job's log (branch ci-log-${{ matrix.mc }})
        if: always()
        run: |
          mkdir -p "$GITHUB_WORKSPACE/out/${{ matrix.mc }}"
          echo "${{ github.sha }} run ${{ github.run_number }} job=${{ job.status }}" > "$GITHUB_WORKSPACE/out/${{ matrix.mc }}/STATUS"
          cd /tmp && rm -rf jl && mkdir jl && cd jl && git init -q && git checkout -q -b ci-log-${{ matrix.mc }}
          git config user.name gruz-ci; git config user.email ci@gruz.invalid
          cp -r "$GITHUB_WORKSPACE/out/${{ matrix.mc }}/." . ; rm -f *.jar
          [ -f full.log ] && tail -c 300000 full.log > tail.log && rm full.log
          [ -f smoke.log ] && tail -c 400000 smoke.log > smoke-tail.log && rm smoke.log
          git add -A && git commit -qm "log ${{ matrix.mc }} run ${{ github.run_number }}"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" ci-log-${{ matrix.mc }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: out-${{ matrix.mc }}
          path: out/${{ matrix.mc }}
  report:
    needs: build
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with: { path: art }
      - name: Publish jars that passed the smoke test (release "mod")
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          mkdir -p rel
          for d in art/out-*; do
            v=${d##*/out-}
            s="$(cat $d/smoke 2>/dev/null)"
            if [ "$s" = "OK" ] || [ "$s" = "NOGPU" ]; then cp $d/gruzclient-*.jar rel/ 2>/dev/null; fi
          done
          {
            ls -la rel
            if ls rel/*.jar >/dev/null 2>&1; then
              python3 ci/manifest.py rel > rel/versions.json && cat rel/versions.json
              gh release delete mod -y --cleanup-tag
              gh release create mod rel/* --title "Gruz Client mod" --notes "Automatyczny build z ${{ github.sha }}" --latest --target ${{ github.sha }}
              echo "release exit $?"
            else
              echo "no jars passed"
            fi
          } > /tmp/publish.log 2>&1
          cat /tmp/publish.log
      - name: Summary + publish to ci-results
        if: always()
        run: |
          python3 ci/summary.py art "${{ github.sha }}" "${{ github.run_number }}" > /tmp/STATUS.md || echo "summary failed $(ls art)" > /tmp/STATUS.md
          cd /tmp && rm -rf res && mkdir res && cd res && git init -q && git checkout -q -b ci-results
          git config user.name gruz-ci; git config user.email ci@gruz.invalid
          git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}"
          (git fetch -q origin ci-results && git reset -q --hard origin/ci-results) || true
          rm -rf build && mkdir -p build
          cp /tmp/STATUS.md build/STATUS.md
          cp /tmp/publish.log build/publish.log 2>/dev/null
          (git add -A && git commit -qm "build run ${{ github.run_number }} (${{ github.sha }})" && git push -q origin ci-results) || (sleep 5; git pull -q --rebase origin ci-results && git push -q origin ci-results)
