name: migrate-to-mojmap
on:
  push:
    branches: [main]
    paths: ['.github/workflows/migrate.yml']
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - uses: gradle/actions/setup-gradle@v4
      - name: Build (yarn, sanity)
        run: |
          mkdir -p logs
          chmod +x gradlew
          ./gradlew --no-daemon build -x copyToLauncher > logs/build-yarn.log 2>&1 || (tail -200 logs/build-yarn.log; exit 1)
      - name: Migrate to Mojang mappings
        run: |
          ./gradlew --no-daemon migrateMappings --mappings "net.minecraft:mappings:1.21.1" --input src/main/java --output src/main/java --overrideInputsIHaveABackup > logs/migrate.log 2>&1 || (tail -200 logs/migrate.log; exit 1)
          git diff --stat > logs/migrate-diff-stat.txt
      - name: Push migrated sources to branch mojmap
        run: |
          git config user.name gruz-ci; git config user.email ci@gruz.invalid
          git checkout -b mojmap
          git add -A src && git commit -qm "Migrate to Mojang mappings (1.21.1)" && git push -f origin mojmap
      - name: Publish logs
        if: always()
        run: |
          cd /tmp && rm -rf res && mkdir res && cd res && git init -q && git checkout -q -b ci-results
          git config user.name gruz-ci; git config user.email ci@gruz.invalid
          git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}"
          (git fetch -q origin ci-results && git reset -q --hard origin/ci-results) || true
          rm -rf migrate && mkdir -p migrate && cp -r "$GITHUB_WORKSPACE"/logs/. migrate/ 2>/dev/null || true
          echo "${{ github.sha }} ${{ job.status }} run ${{ github.run_number }}" > migrate/STATUS
          git add -A && git commit -qm "migrate run ${{ github.run_number }}" && git push -q origin ci-results
