plugins {
	id "net.fabricmc.fabric-loom-remap" version "${loom_version}"
	id "legacy-looming" version "${loom_version}" // Version must be the same as fabric-loom's
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	// Add repositories to retrieve artifacts from in here.
	// You should only use this when depending on other mods because
	// Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
	// See https://docs.gradle.org/current/userguide/declaring_repositories.html
	// for more information about repositories.
}

loom {
	// Only needed for versions not available from vanilla launcher by default.
	// customMinecraftManifest.set("https://meta.legacyfabric.net/v2/manifest/${minecraft_version}")

	// Required by 1.7.x
	// runs {
	// 	client {
	// 		programArgs "--userProperties", "{}"
	// 	}
	// }
}

legacyLooming {
	// 	The generation of intermediary to use, default is 1.
	// 	legacy.yarn() will automatically point at the variant for the set intermediary generation.
	// 	However do not forget to set the right build number of legacy yarn as they are different per variant.
	//	intermediaryVersion = 2

	// 	Wether to use Legacy Fabric intermediaries or Upstream/Official FabricMC ones.
	//	Default to true: use Legacy Fabric intermediaries.
	// 	If setting to false, don't forget to also set intermediaryVersion to generation 2.
	//	useLFIntermediary.set(false)
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings(legacy.yarn(project.minecraft_version, project.yarn_build))
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// bez Legacy Fabric API – wszystko przez mixiny (launcher nie musi niczego doinstalowywać)
	// If you use LFAPI with MC 1.3.2, 1.4.7 or 1.5.2, uncomment the next line
	// implementation('com.google.code.gson:gson:2.8.9')

	// You can retrieve a specific api module using this notation.
	// modImplementation(legacy.apiModule("legacy-fabric-item-groups-v1", project.fabric_version))
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": inputs.properties.version
	}
}

tasks.withType(JavaCompile).configureEach {
	// Ensure that the encoding is set to UTF-8, no matter what the system default is
	// this fixes some edge cases with special characters not displaying correctly
	// see http://yodaconditions.net/blog/fix-for-java-file-encoding-problems-with-gradle.html
	it.options.encoding = "UTF-8"

	if (JavaVersion.current().isJava9Compatible()) {
		it.options.release = 8
	}
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.

	sourceCompatibility = JavaVersion.VERSION_1_8
	targetCompatibility = JavaVersion.VERSION_1_8
}

jar {
	inputs.property "archivesName", project.base.archivesName

	from("LICENSE") {
		rename { "${it}_${inputs.properties.archivesName}"}
	}
}


// peleryny HD (te same obrazki co w modzie na nowe wersje) – bez kopii plików w repo
processResources {
	from('../../src/main/resources') { include 'assets/gruzclient/textures/cape/*.png' }
}

// test w świecie (tylko lokalnie): GRUZ_FT=1 ./gradlew runClient
if (System.getenv('GRUZ_FT')) {
	loom { runs { client { vmArg '-Dgruz.featuretest=true'; vmArg '-Dgruz.cosmetics=cape=nebula;color=b45cff'; if (System.getenv('GRUZ_SERVER')) vmArg "-Dgruz.server=${System.getenv('GRUZ_SERVER')}"; programArgs '--username', 'GruzTest' } } }
}

// test uruchomienia w CI: GRUZ_SMOKE=1 ./gradlew runClient
if (System.getenv('GRUZ_SMOKE')) {
	loom { runs { client { vmArg '-Dgruz.smoketest=true'; programArgs '--username', 'GruzCI' } } }
}

// zdjęcie na kartę wersji w launcherze (tylko lokalnie): GRUZ_CARDS=<nasiono> ./gradlew runClient
if (System.getenv('GRUZ_CARDS')) {
	loom { runs { client { vmArg '-Dgruz.cardshot=true'; vmArg "-Dgruz.cardseed=${System.getenv('GRUZ_CARDS')}"; programArgs '--username', 'GruzCard', '--width', '960', '--height', '720' } } }
}
